# SPDX-License-Identifier: MIT AND Apache-2.0
[workspace]
resolver = "2"
members = [
    "crates/nft-types",
    "crates/membership-proof",
    "crates/nft-provider-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0"
description = "LP-0001 Phase 0: NFT membership private-ownership proof contracts and host-side library (no real ZK yet)"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
nft-types = { path = "crates/nft-types" }
membership-proof = { path = "crates/membership-proof" }
